services:
  - type: web
    name: cfr-poker-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=. uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHONPATH
        value: .
      - key: PYTHON_VERSION
        value: 3.12.3
